<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAHINA: FOREST SPIRIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-light"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>
    <div class="firefly"></div>

    <main class="main-container">
        
        <header class="glass-header">
            <div class="logo-area">
                <h1>KAHINA</h1>
                <span class="subtitle">SPIRIT GUARDIAN</span>
            </div>
            <div class="player-status">
                <div class="resource-badge gold">
                    <span class="icon">✨</span>
                    <span id="essence-display">0</span> ESSENCE
                </div>
                <div class="resource-badge spirit">
                    <span class="icon">🌿</span>
                    <span id="level-display">LVL 1</span>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            
            <aside class="glass-panel profile-panel 3d-card">
                <div class="hero-container">
                    <div class="hero-frame">
                        <img src="./images/princess.avif" alt="Kahina" class="hero-img">
                        <div class="glow-ring"></div>
                    </div>
                    <h2>KAHINA</h2>
                    <p class="hero-title">Gardienne de la Source</p>
                </div>
                
                <div class="stats-container">
                    <div class="stat-row">
                        <label>PUISSANCE</label>
                        <div class="bar-bg"><div class="bar-fill power" style="width: 60%"></div></div>
                    </div>
                    <div class="stat-row">
                        <label>AGILITÉ</label>
                        <div class="bar-bg"><div class="bar-fill agility" style="width: 60%"></div></div>
                    </div>
                    <div class="stat-row">
                        <label>HARMONIE</label>
                        <div class="bar-bg"><div class="bar-fill magic" style="width: 60%"></div></div>
                    </div>
                </div>
            </aside>

            <section class="glass-panel main-stage">
                
                <div id="selection-screen" class="screen active">
                    <h2 class="screen-title">DÉFIEZ LES ESPRITS CORROMPUS</h2>
                    <div id="enemy-grid" class="grid-container">
                        </div>
                    <button id="battle-btn" class="action-btn hidden">COMMENCER LE RITUEL</button>
                </div>

                <div id="battle-screen" class="screen hidden">
                    <div class="battle-arena">
                        <div class="lane player-lane">
                            <div class="avatar-bubble">
                                <img src="./images/princess.avif" alt="Kahina">
                            </div>
                            <div class="track">
                                <div id="player-progress" class="progress-liquid player-liquid"></div>
                            </div>
                        </div>
                        
                        <div class="versus-badge">VS</div>

                        <div class="lane enemy-lane">
                            <div class="avatar-bubble">
                                <img id="enemy-img-battle" src="" alt="Enemy">
                            </div>
                            <div class="track">
                                <div id="enemy-progress" class="progress-liquid enemy-liquid"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="battle-log" class="battle-status">PRÉPARATION...</div>
                    <button id="reset-btn" class="action-btn secondary hidden">RETOUR À LA FORÊT</button>
                </div>

            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
