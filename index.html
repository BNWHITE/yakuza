<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <meta charset="UTF-8">
    <title>ISEP Jungle Code Quest - Media Queries Pro Demo</title>
    
    <style>
        /* ================================================= */
        /* 🎨 CSS DETAILLÉ : Design "Jungle Code" et Responsive */
        /* (Le CSS reste inchangé par rapport à la version précédente) */
        /* ================================================= */
        
        /* --------------------- FONT IMPORT --------------------- */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap');
        
        /* --------------------- VARIABLES GLOBALES --------------------- */
        :root {
            --jungle-green-dark: #1e3c28;
            --jungle-green-medium: #2a523a;
            --jungle-glow: #aaffaa;
            --glow-shadow: 0 0 15px var(--jungle-glow), 0 0 5px var(--jungle-glow);
            --text-color-light: #fff;
            --button-color: #f7b731;
            --track-color: #3b533f;
            --track-border: #15281b;
        }

        /* --------------------- GLOBAL & STRUCTURE --------------------- */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: linear-gradient(to bottom, var(--jungle-green-dark) 0%, #0d1e13 100%);
            color: var(--text-color-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
            position: relative;
        }

        h1, h2, h3, #countdown, #race-result, #kebab-score-display {
            font-family: 'Press Start 2P', cursive;
            color: var(--jungle-glow);
            text-shadow: var(--glow-shadow);
        }
        h1 { font-size: 2.8em; margin: 0; }
        h2 { font-size: 1.6em; margin: 20px 0 10px; }
        h3 { font-size: 1.2em; margin-bottom: 10px; }
        
        /* Affichage Kebab Score */
        #kebab-score-display {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.1em;
            padding: 5px 10px;
            background-color: var(--button-color);
            color: #222;
            border-radius: 5px;
            text-shadow: none;
        }

        section {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid var(--jungle-glow);
            box-shadow: 0 0 30px rgba(170, 255, 170, 0.5);
            margin: 20px 0;
            width: 90%;
            max-width: 1100px;
            text-align: center;
        }

        /* --------------------- BOUTONS & CONTROLES --------------------- */
        .action-button {
            background-color: var(--button-color);
            color: #222;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            cursor: pointer;
            margin: 15px 10px 0;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        .action-button:hover {
            background-color: var(--button-hover-color);
            transform: translateY(-3px);
        }

        /* --------------------- ÉCRAN DE SÉLECTION (PROBLÈME MQ) --------------------- */
        #student-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .student-card {
            background-color: var(--jungle-green-medium);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            position: relative;
        }

        .student-card.selected {
            border-color: var(--button-color);
            box-shadow: 0 0 20px var(--jungle-glow);
            transform: scale(1.05);
            background-color: var(--jungle-green-dark);
        }
        
        .student-avatar {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border: 4px solid var(--jungle-glow);
            background-color: #222;
            padding: 5px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        /* Style spécifique pour Mme CHABCHOUB */
        .student-card.chabchoub-card .student-avatar {
            border-color: #ffbb00;
            box-shadow: 0 0 15px #ffbb00;
        }
        
        .student-card span.title {
            display: block;
            font-size: 0.8em;
            color: var(--jungle-glow);
            text-shadow: 0 0 5px #000;
            margin-top: 5px;
            font-family: 'Press Start 2P', cursive;
        }

        /* ----- STATS CARD (inchangé) ----- */
        .stats-card {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .stat-bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.85em;
        }
        .stat-bar-container label {
            width: 40%;
            text-align: left;
            padding-right: 5px;
        }
        .stat-bar {
            flex-grow: 1;
            height: 8px;
            background-color: #444;
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            background-color: #f25f5c;
            transition: width 0.5s;
        }
        .stat-fill[data-stat="codage"] { background-color: #4CAF50; }
        .stat-fill[data-stat="vitesse"] { background-color: #00bcd4; }
        .stat-fill[data-stat="chance"] { background-color: #ffeb3b; }


        /* --------------------- ÉCRAN DE COURSE (inchangé) --------------------- */
        .race-track {
            background-color: var(--track-color);
            border: 5px solid var(--track-border);
            border-radius: 10px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            height: 250px;
            width: 95%;
            box-shadow: inset 0 0 30px rgba(0, 255, 0, 0.5);
            overflow: hidden;
        }

        .cat-lane {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        .cat-lane:nth-child(1) { top: 10px; }
        .cat-lane:nth-child(2) { bottom: 10px; }

        .cat-lane img {
            width: 100px;
            height: auto;
            padding: 5px;
            border: 3px solid var(--jungle-glow);
            background-color: #222;
            position: relative;
            transition: transform 0.1s linear;
            z-index: 10;
        }

        .cat-lane .cat-name {
            font-family: 'Roboto', sans-serif;
            margin-left: 15px;
            font-size: 1em;
            color: #222;
            background-color: var(--jungle-glow);
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
        }
        
        #countdown { font-size: 3.5em; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; background: rgba(0, 0, 0, 0.8); padding: 5px 15px; border-radius: 8px;}

        /* --------------------- OPTIONS & HISTORIQUE (inchangé) --------------------- */
        #options-menu, #history-log {
            text-align: left;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 20px;
        }
        #options-menu label {
            display: block;
            margin-bottom: 10px;
        }
        .history-item {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding: 5px 0;
            font-size: 0.9em;
        }
        .history-item.win { color: var(--jungle-glow); }
        .history-item.lose { color: #f25f5c; }
        .history-item.mq-active { font-style: italic; opacity: 0.8;}

        /* ================================================= */
        /* 🛠️ SOLUTION : Les Media Queries (inchangé) 🛠️ */
        /* ================================================= */


        /* // 1. Petits écrans (Smartphones) */
        
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            h2 { font-size: 1em; margin: 15px 0; }
            h3 { font-size: 1em; }
        
            #student-selector {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .student-card {
                padding: 10px;
            }
            .student-avatar {
                width: 60px;
                height: 60px;
            }
            .stat-bar-container {
                font-size: 0.75em;
            }
        
            #kebab-score-display {
                font-size: 0.9em;
                padding: 3px 6px;
                top: 5px;
                right: 5px;
            }
        
            .race-track {
                height: 120px; 
                padding: 5px;
            }
            .cat-lane img {
                width: 50px;
            }
            .cat-lane .cat-name {
                font-size: 0.7em;
                margin-left: 8px;
                padding: 3px 6px;
            }
            #countdown { font-size: 1.8em; }
            #race-result { font-size: 1.2em; }
        }
        /* 2. Écrans de taille moyenne (Tablettes) */
         @media (max-width: 992px) {
            h1 { font-size: 2em; }
            h2 { font-size: 1.4em; }
        
            #student-selector {
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px;
            }
            .student-avatar {
                width: 70px;
                height: 70px;
            }
            
            .race-track {
                height: 180px;
            }
            .cat-lane img {
                width: 80px;
            }
            .cat-lane .cat-name {
                font-size: 0.8em;
                margin-left: 10px;
            }
        }
        
    </style>
</head>
<body>
    <header>
        <div id="kebab-score-display">0 K</div>
        <h1>ISEP Code Quest</h1>
        <h2>Jungle Edition (Démonstration Responsive Pro)</h2>
    </header>

    <main>
        <section id="selection-screen">
            <h2>Choisissez votre Bot-Explorateur :</h2>
            <p id="mq-status"></p>

            <div id="student-selector">
                </div>
            
            <button id="start-race-btn" class="action-button" style="display: none;">Lancer la Quête !</button>
            
            <div id="options-menu">
                <h3>🛠️ Options de Course</h3>
                <label>
                    <input type="checkbox" id="speed-boost-option">
                    Boost de Vitesse (Bonus de 10% sur la stat Vitesse)
                </label>
                <label>
                    <input type="checkbox" id="luck-charm-option">
                    Talisman de Chance (Augmente la variance de victoire)
                </label>
            </div>
        </section>

        <section id="race-screen" style="display: none;">
            <h2>Sentier de la Connaissance Perdue</h2>
            <h3 id="countdown">3</h3>
            
            <div class="race-track">
                <div style="position: absolute; right: 10px; top: 0; bottom: 0; width: 5px; background-color: var(--button-color); z-index: 15;"></div>
                
                <div class="cat-lane">
                    <img id="player-cat" src="" alt="Votre Bot">
                    <span id="player-name" class="cat-name"></span>
                </div>
                <div class="cat-lane">
                    <img id="opponent-cat" src="" alt="Bot Adversaire">
                    <span id="opponent-name" class="cat-name"></span>
                </div>
            </div>
            <h3 id="race-result"></h3>
            <button id="reset-race-btn" class="action-button" style="display: none;">Nouvelle Expédition</button>
        </section>
        
        <section id="history-section">
            <h2>📜 Historique des Quêtes</h2>
            <div id="history-log">
                <p style="opacity: 0.7;">Aucune course n'a été lancée pour le moment.</p>
            </div>
        </section>
    </main>

    <audio id="defeat-audio" src="madame-la-directrice-degat-degat-le-p-breziani_orZPPW2u.mp3" preload="auto"></audio>

    <script>
        /* ================================================= */
        /* 🧠 JAVASCRIPT DETAILLÉ : Logique, Stats et Score Kebab */
        /* (Ajout de la gestion de l'audio) */
        /* ================================================= */
        
        const students = [
            // Données étudiantes complètes
            { name: "Alexandre ALVES", title: "Le Débogueur", stats: {} }, { name: "Douae BOULOUALI", title: "L'impératrice", stats: {} }, { name: "Sid-Ahmed BOUSLAH", title: "Chill Boy", stats: {} }, { name: "Leon JIANG", title: "FinoVox", stats: {} }, { name: "Alheli RODRIGUEZ", title: "L'intentionnée", stats: {} },
            { name: "Maxime BOGNON", title: "Maximilien", stats: {} }, { name: "Corentin BRAND", title: "Le favoris", stats: {} }, { name: "Maximilien CANONNE", title: "Luminosité Minimum", stats: {} }, { name: "Adel HENI", title: "Le plavonneur", stats: {} }, { name: "Kahina MEDJUKANE", title: "La profiteuse", stats: {} },
            { name: "Sully MORETON", title: "Le stagiaire", stats: {} }, { name: "Aliénor ANTONA", title: "La gourmande🍔", stats: {} }, { name: "Nicolas CLEMENT", title: "Le délégué", stats: {} }, { name: "Bryan DE FARIA", title: "Le Chargeur", stats: {} }, { name: "Hani HOUMIMID", title: "Le turc 🇹🇷", stats: {} },
            { name: "Vithues KANDIAH", title: "ECE Water", stats: {} }, { name: "Hector LE BACHELIER", title: "L'Ingénieur Papier", stats: {} }, { name: "Quentin DABOVILLE", title: "Le Bretons", stats: {} }, { name: "Yassmina HARRISSI", title: "La Libanaise🇱🇧", stats: {} }, { name: "Allan LAHCENE", title: " Le + Chill", stats: {} },
            { name: "Evan MASSE", title: "Hasfy", stats: {} }, { name: "Seydina SY", title: "Git init", stats: {} }, { name: "Ilay AL ABIAD", title: "Brother from an other mother", stats: {} }, { name: "Ahmed ELHATTAB", title: "English Boy", stats: {} }, { name: "Thushyan KOHILAKUMAR", title: "L'Orfèvre", stats: {} },
            { name: "Aurélie MAHAUT", title: "La Stratège", stats: {} }, { name: "Gaspard PONS", title: "Le Philosophe", stats: {} }, { name: "Rafael RION", title: "L'Alchimiste", stats: {} }, { name: "Faruk SAN", title: "Le connaisseur", stats: {} },
            // Profil Professeur
            { name: "Mme CHABCHOUB", title: "La Guide du Code Sacré", stats: { vitesse: 100, codage: 100, chance: 100 } }
        ];

        const elements = {
            selector: document.getElementById('student-selector'),
            startBtn: document.getElementById('start-race-btn'),
            selectionScreen: document.getElementById('selection-screen'),
            raceScreen: document.getElementById('race-screen'),
            playerCat: document.getElementById('player-cat'),
            playerName: document.getElementById('player-name'),
            opponentCat: document.getElementById('opponent-cat'),
            opponentName: document.getElementById('opponent-name'),
            countdown: document.getElementById('countdown'),
            raceResult: document.getElementById('race-result'),
            resetBtn: document.getElementById('reset-race-btn'),
            historyLog: document.getElementById('history-log'),
            mqStatus: document.getElementById('mq-status'),
            speedBoost: document.getElementById('speed-boost-option'),
            luckCharm: document.getElementById('luck-charm-option'),
            kebabDisplay: document.getElementById('kebab-score-display'),
            defeatAudio: document.getElementById('defeat-audio') // Référence à l'élément audio
        };

        let selectedBot = null;
        let opponentBot = null;
        let raceHistory = [];
        let kebabScore = 0;

        // ------------------------------------
        // FONCTIONNALITÉS AUDIO
        // ------------------------------------
        function playDefeatSound() {
            // Joue le son uniquement si l'adversaire n'est PAS la prof
            if (opponentBot.name !== "Mme CHABCHOUB") {
                elements.defeatAudio.currentTime = 0; // Rembobine le son
                elements.defeatAudio.play().catch(e => console.error("Erreur lecture audio :", e)); // Capture l'erreur si l'utilisateur n'a pas interagi
            }
        }
        
        // ------------------------------------
        // FONCTIONNALITÉS AVANCÉES (inchangé)
        // ------------------------------------
        
        function updateKebabScore(amount) {
            kebabScore += amount;
            elements.kebabDisplay.textContent = `${kebabScore} K`;
        }

        function generateStats(bot) {
            if (bot.name === "Mme CHABCHOUB") {
            } else if (Object.keys(bot.stats).length === 0) {
                bot.stats.vitesse = 40 + Math.floor(Math.random() * 40);
                bot.stats.codage = 40 + Math.floor(Math.random() * 40);
                bot.stats.chance = 1 + Math.floor(Math.random() * 50);
            }
        }

        function renderStats(card, bot) {
            const statsHTML = `
                <div class="stats-card">
                    <div class="stat-bar-container"><label>Vitesse :</label><div class="stat-bar"><div class="stat-fill" data-stat="vitesse" style="width: ${bot.stats.vitesse}%;"></div></div></div>
                    <div class="stat-bar-container"><label>Codage :</label><div class="stat-bar"><div class="stat-fill" data-stat="codage" style="width: ${bot.stats.codage}%;"></div></div></div>
                    <div class="stat-bar-container"><label>Chance :</label><div class="stat-bar"><div class="stat-fill" data-stat="chance" style="width: ${bot.stats.chance + 50}%;"></div></div></div>
                </div>
            `;
            card.insertAdjacentHTML('beforeend', statsHTML);
        }

        function updateMQStatus() {
            const mq = window.matchMedia("(max-width: 600px)");
            if (mq.matches) {
                elements.mqStatus.innerHTML = `⚠️ **MODE MOBILE ACTIVÉ** (Media Query: 1 colonne). L'affichage a été réorganisé pour éviter le débordement.`;
                elements.mqStatus.style.color = '#ffeb3b';
            } else if (window.innerWidth <= 992) {
                 elements.mqStatus.innerHTML = `✅ **MODE TABLETTE ACTIVÉ** (Media Query: 2 colonnes).`;
                 elements.mqStatus.style.color = '#aaffaa';
            }
            else {
                elements.mqStatus.innerHTML = `🖥️ **MODE PC** (Grille 4 colonnes). Réduisez la fenêtre pour voir la magie des Media Queries !`;
                elements.mqStatus.style.color = '#fff';
            }
        }
        window.addEventListener('resize', updateMQStatus);

        function logRace(winnerName, isPlayerWinner, mqUsed, kebabGain) {
            const resultClass = isPlayerWinner ? 'win' : 'lose';
            const mqText = mqUsed ? ' (Responsive Actif)' : '';
            const gainText = isPlayerWinner ? ` (+${kebabGain} K)` : '';
            
            const logEntry = document.createElement('p');
            logEntry.classList.add('history-item', resultClass);
            if (mqUsed) logEntry.classList.add('mq-active');
            
            logEntry.innerHTML = `[${new Date().toLocaleTimeString()}] : La Quête a été gagnée par **${winnerName}**. ${gainText} ${mqText}`;
            
            if (raceHistory.length === 0) {
                 elements.historyLog.innerHTML = '';
            }
            elements.historyLog.prepend(logEntry);
            raceHistory.push(logEntry);
        }

        // ------------------------------------
        // LOGIQUE DE BASE DU JEU (inchangé)
        // ------------------------------------

        function initializeSelection() {
            elements.selector.innerHTML = '';
            students.forEach(bot => {
                generateStats(bot);
                
                const card = document.createElement('div');
                card.classList.add('student-card');
                if (bot.name === "Mme CHABCHOUB") {
                    card.classList.add('chabchoub-card');
                }
                
                let avatarUrl;
                if (bot.name === "Mme CHABCHOUB") {
                    avatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=Chabchoub&scale=110&size=100&eyes=bulgy,round&mouth=smile,pucker&sides=square,round&top=antenna,cone&face=square,round&color=aaffaa,ffbb00,4CAF50,00bcd4`;
                } else {
                    avatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=${encodeURIComponent(bot.name)}&scale=110&size=100`;
                }
                
                const avatar = document.createElement('img');
                avatar.classList.add('student-avatar');
                avatar.src = avatarUrl;
                
                const nameElement = document.createElement('p');
                nameElement.textContent = bot.name;
                
                const titleElement = document.createElement('span');
                titleElement.classList.add('title');
                titleElement.textContent = bot.title;
                
                card.appendChild(avatar);
                card.appendChild(nameElement);
                card.appendChild(titleElement);
                
                renderStats(card, bot);
                
                card.addEventListener('click', () => selectBot(bot, card, avatarUrl));
                elements.selector.appendChild(card);
            });

            elements.startBtn.style.display = 'none';
            elements.raceScreen.style.display = 'none';
            elements.selectionScreen.style.display = 'block';
            elements.resetBtn.style.display = 'none';
            elements.raceResult.textContent = '';
            
            elements.playerCat.style.transform = `translateX(0px)`;
            elements.opponentCat.style.transform = `translateX(0px)`;
            
            updateMQStatus();
            updateKebabScore(0);
        }

        function selectBot(bot, card, avatarUrl) {
            Array.from(elements.selector.children).forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedBot = bot;
            elements.playerCat.src = avatarUrl;
            elements.startBtn.style.display = 'block';
        }

        function generateOpponent() {
            let randomOpponent;
            do {
                const index = Math.floor(Math.random() * students.length);
                randomOpponent = students[index];
            } while (randomOpponent.name === selectedBot.name);
            return randomOpponent;
        }

        elements.startBtn.addEventListener('click', () => {
            if (!selectedBot) return;

            opponentBot = generateOpponent();
            generateStats(opponentBot);

            elements.playerName.textContent = selectedBot.name;
            elements.opponentName.textContent = opponentBot.name;
            
            let opponentAvatarUrl;
            if (opponentBot.name === "Mme CHABCHOUB") {
                opponentAvatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=Chabchoub&scale=110&size=100&eyes=bulgy,round&mouth=smile,pucker&sides=square,round&top=antenna,cone&face=square,round&color=aaffaa,ffbb00,4CAF50,00bcd4`;
            } else {
                opponentAvatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=${encodeURIComponent(opponentBot.name)}&scale=110&size=100`;
            }
            elements.opponentCat.src = opponentAvatarUrl;

            elements.selectionScreen.style.display = 'none';
            elements.raceScreen.style.display = 'block';
            
            startCountdown();
        });

        function startCountdown() {
            let count = 3;
            elements.countdown.textContent = count;
            elements.countdown.style.display = 'block';
            elements.raceResult.textContent = '';
            elements.resetBtn.style.display = 'none';
            
            elements.playerCat.style.transform = `translateX(0px)`;
            elements.opponentCat.style.transform = `translateX(0px)`;


            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    elements.countdown.textContent = count;
                } else if (count === 0) {
                    elements.countdown.textContent = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    elements.countdown.style.display = 'none';
                    startRace();
                }
            }, 1000);
        }

        function startRace() {
            const trackWidth = document.querySelector('.race-track').offsetWidth - elements.playerCat.offsetWidth - 30;
            let playerPosition = 0;
            let opponentPosition = 0;
            
            let playerBaseSpeed = selectedBot.stats.vitesse;
            let opponentBaseSpeed = opponentBot.stats.vitesse;
            
            if (elements.speedBoost.checked) {
                playerBaseSpeed *= 1.1;
            }

            currentRaceInterval = setInterval(() => {
                const playerVariance = elements.luckCharm.checked ? (Math.random() * (100 - selectedBot.stats.chance) / 50) : (Math.random() * 0.8);
                const opponentVariance = elements.luckCharm.checked ? (Math.random() * (100 - opponentBot.stats.chance) / 50) : (Math.random() * 0.8);
                
                playerPosition += (playerBaseSpeed / 10) + playerVariance; 
                opponentPosition += (opponentBaseSpeed / 10) + opponentVariance; 

                elements.playerCat.style.transform = `translateX(${Math.min(playerPosition, trackWidth)}px)`;
                elements.opponentCat.style.transform = `translateX(${Math.min(opponentPosition, trackWidth)}px)`;

                if (playerPosition >= trackWidth || opponentPosition >= trackWidth) {
                    clearInterval(currentRaceInterval);
                    declareWinner(playerPosition, opponentPosition);
                }
            }, 70); 
        }

        function declareWinner(playerPos, opponentPos) {
            const mqUsed = window.matchMedia("(max-width: 992px)").matches;
            let winnerName;
            let isPlayerWinner;
            let kebabGain = 0;

            if (playerPos > opponentPos) {
                winnerName = selectedBot.name;
                isPlayerWinner = true;
                
                kebabGain = 5 + Math.floor(Math.random() * 5);
                updateKebabScore(kebabGain);
                
                elements.raceResult.textContent = `🏆 ${selectedBot.name} trouve le Bug Sacré ! Victoire et ${kebabGain} K !`;
                elements.raceResult.classList.remove('lose');
                elements.raceResult.classList.add('win');
            } else {
                winnerName = opponentBot.name;
                isPlayerWinner = false;
                
                elements.raceResult.textContent = `😭 ${opponentBot.name} gagne la Quête ! Dégât, dégât...`;
                elements.raceResult.classList.remove('win');
                elements.raceResult.classList.add('lose');
                
                // --- NOUVEAU : Jouer l'audio de défaite ---
                playDefeatSound();
            }
            
            logRace(winnerName, isPlayerWinner, mqUsed, kebabGain);
            elements.resetBtn.style.display = 'block';
        }

        elements.resetBtn.addEventListener('click', initializeSelection);

        // Initialiser le jeu au chargement
        initializeSelection();
    </script>
</body>
</html>
