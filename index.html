<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEP Qui est Qui ? - Media Queries Demo</title>
    
    <style>
        /* ================================================= */
        /* 🎨 STYLE.CSS : Le Problème et la Solution (Intégration) */
        /* ================================================= */
        
        /* Styles généraux */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #004a7c; /* Bleu ISEP */
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* 💥 ZONE DU PROBLÈME : Grille non-responsive 💥 */
        #student-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 colonnes fixes = DÉBORDEMENT sur petit écran */
            gap: 25px; 
            padding: 20px 0;
        }

        .student-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .student-avatar {
            /* Avatar générique */
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }

        .student-card h3 {
            color: #004a7c;
            margin-bottom: 8px;
            font-size: 1.5em;
        }

        .student-card h4 {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .student-card p {
            font-size: 0.95em;
            color: #555;
            min-height: 60px; /* Pour aligner les cartes sur PC */
        }

        /* ================================================= */
        /* 🛠️ ZONE DE LA SOLUTION : Les Media Queries 🛠️ */
        /* ================================================= */

        /* 1. Écrans de taille moyenne (Tablettes) */
        @media (max-width: 992px) {
            #student-grid {
                grid-template-columns: repeat(2, 1fr); /* On passe à 2 colonnes */
                gap: 20px;
            }
        }

        /* 2. Petits écrans (Smartphones) */
        @media (max-width: 600px) {
            #student-grid {
                grid-template-columns: 1fr; /* Une seule colonne, les cartes s'empilent parfaitement */
                gap: 15px;
            }

            .student-card p {
                min-height: auto; /* Supprime la hauteur minimale sur mobile */
            }

            /* Ajustements mineurs de taille pour le mobile */
            .header-content h1 {
                font-size: 1.8em;
            }
            main {
                padding: 0 10px;
            }
            .student-avatar {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>ISEP "Qui est Qui ?"</h1>
            <p>Découvrez les légendes de votre promo !</p>
        </div>
    </header>

    <main>
        <div id="student-grid">
            </div>
    </main>

    <script>
        /* ================================================= */
        /* 🧠 SCRIPT.JS : La Liste des Étudiants et la Logique (Intégration) */
        /* ================================================= */
        
        const studentsData = [
            // Liste complète des étudiants de la photo, sans Moncef Ahmane
            { name: "Alexandre ALVES", title: "Le Seigneur des Pauses Café", anecdote: "On dit qu'il peut repérer la machine à café vide à 200 mètres." },
            { name: "Douae BOULOUALI", title: "La Doyenne des Raccourcis Clavier", anecdote: "Son bureau ressemble à un clavier géant, et elle connaît toutes les commandes secrètes." },
            { name: "Sid-Ahmed BOUSLAH", title: "Le Décodeur de Blagues de Profs", anecdote: "Le seul qui comprend les références des années 80 dans les cours d'info." },
            { name: "Leon JIANG", title: "Le Chuchoteur de Bugs", anecdote: "Murmure des mots doux à son code jusqu'à ce qu'il fonctionne." },
            { name: "Altheli RODRIGUEZ", title: "L'Archéologue du Frigo Commun", anecdote: "Elle a déjà découvert des yaourts datant du paléolithique." },
            { name: "Maxime BOGNON", title: "Le Maître de la Sieste en Amphi", anecdote: "Peut dormir debout pendant un cours, et se réveiller juste pour la question." },
            { name: "Corentin BRAND", title: "Le Barde du Binaire", anecdote: "Composera une chanson en octal si on le lui demande." },
            { name: "Maximilien CANONNE", title: "Le Spécialiste de la Reconnaissance Faciale", anecdote: "Saisit tous les cookies qui passent à moins de 5 mètres." },
            { name: "Adel HENI", title: "Le Jedi du WiFi", anecdote: "Ses doigts détectent le point d'accès le plus faible et l'améliorent par la pensée." },
            { name: "Kahina MEDJUKANE", title: "La Conteuse d'Histoires de Projets Foireux", anecdote: "Ses récits de projets qui ont mal tourné sont légendaires." },
            { name: "Sully MORETON", title: "Le Navigator des Labyrinthes de l'ISEP", anecdote: "Peut trouver n'importe quelle salle, même celles qui n'existent pas encore." },
            { name: "Aliénor ANTONA", title: "La Collectionneuse de Stylos Oubliés", anecdote: "Son sac à dos est un musée de stylos retrouvés après les cours." },
            { name: "Nicolas CLEMENT", title: "Le Pro du Débuggage Nocturne", anecdote: "Travaille mieux quand tout le monde dort, et que le café est frais." },
            { name: "Bryan DE FARIA", title: "Le Détective des Ports USB Libres", anecdote: "Ses yeux brillent quand il voit un port USB sans chargeur." },
            { name: "Hani HOUMIMID", title: "L'Amateur de Mèmes Officiels", anecdote: "Il a un mème pour chaque situation à l'ISEP." },
            { name: "Vithues KANDIAH", title: "L'Artisan du Câble Management", anecdote: "Ses câbles sont si bien rangés qu'ils ont leur propre petit écosystème." },
            { name: "Hector LE BACHELIER", title: "L'Ingénieur du Papier", anecdote: "Peut construire une fusée avec une feuille A4 et un trombone." },
            { name: "Quentin DABOVILLE", title: "Le Chasseur de Prises", anecdote: "Sa quête éternelle : trouver la prise électrique parfaite." },
            { name: "Yassmina HARRISSI", title: "L'Experte en Restauration de Fichiers Supprimés", anecdote: "Peut récupérer n'importe quel fichier, même ceux que vous n'avez jamais créés." },
            { name: "Allan LAHCENE", title: "Le Sommelier de la Cantine", anecdote: "Il peut deviner l'origine et l'année de chaque plat servi." },
            { name: "Evan MASSE", title: "Le Gourou du PC Portable", anecdote: "Son ordinateur portable est tellement optimisé qu'il pourrait décoller." },
            { name: "Seydina SY", title: "Le Maître des Présentations PowerPoint Épiques", anecdote: "Ses slides sont si beaux qu'on oublie le contenu." },
            { name: "Ilay AL ABIAD", title: "Le Champion du Retard Optimisé", anecdote: "Arrive toujours à l'heure, à la seconde près, mais jamais avant." },
            { name: "Ahmed ELHATTAB", title: "Le Jardinier Numérique", anecdote: "Ses dossiers sur l'ordinateur sont organisés comme un jardin zen." },
            { name: "Thushyan KOHILAKUMAR", title: "L'Orfèvre du Code Propre", anecdote: "Son code est tellement propre qu'on pourrait manger dessus." },
            { name: "Aurélie MAHAUT", title: "La Stratège des Post-it", anecdote: "Son écran est une œuvre d'art faite de pense-bêtes colorés." },
            { name: "Gaspard PONS", title: "Le Philosophe du Bug", anecdote: "Chaque bug est pour lui une occasion de réflexion existentielle." },
            { name: "Rafael RION", title: "L'Alchimiste du Matériel", anecdote: "Transforme le vieux matériel ISEP en or... ou du moins, le fait fonctionner." },
            { name: "Faruk SAN", title: "Le Connaisseur de l'Open Source", anecdote: "Il a déjà testé toutes les distributions Linux existantes." }
        ];

        const studentGrid = document.getElementById('student-grid');

        function generateCards() {
            studentsData.forEach(student => {
                const card = document.createElement('div');
                card.classList.add('student-card');
                
                // Utilise DiceBear API pour un avatar unique basé sur le nom
                const avatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=${encodeURIComponent(student.name)}`;
                const avatar = document.createElement('img');
                avatar.classList.add('student-avatar');
                avatar.src = avatarUrl;
                avatar.alt = `Avatar de ${student.name}`;
                
                const nameElement = document.createElement('h3');
                nameElement.textContent = student.name;
                
                const titleElement = document.createElement('h4');
                titleElement.textContent = student.title;
                
                const anecdoteElement = document.createElement('p');
                anecdoteElement.textContent = student.anecdote;
                
                card.appendChild(avatar);
                card.appendChild(nameElement);
                card.appendChild(titleElement);
                card.appendChild(anecdoteElement);
                
                studentGrid.appendChild(card);
            });
        }

        // Lancer la génération des cartes au chargement de la page
        generateCards();
    </script>
</body>
</html>
