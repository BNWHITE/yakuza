<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLASSROOM PROTOCOL // VALORANT STYLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="bg-overlay"></div>

    <header class="val-header">
        <div class="brand-logo">
            <span class="riot-fist">👊</span> CLASSROOM <span class="accent">PROTOCOL</span>
        </div>
        <div class="user-status" id="user-status-display">
            AGENT: PENDING...
        </div>
    </header>

    <main>
        <section id="lobby-screen" class="active-screen">
            <div class="lobby-container">
                <div class="auth-panel val-card">
                    <h3>// IDENTIFICATION</h3>
                    <input type="email" id="auth-email" placeholder="EMAIL AGENT" class="val-input">
                    <input type="password" id="auth-password" placeholder="MOT DE PASSE" class="val-input">
                    <div class="btn-group">
                        <button id="signin-btn" class="val-btn">CONNEXION</button>
                        <button id="signup-btn" class="val-btn secondary">RECRUTEMENT</button>
                    </div>
                    <p id="auth-msg"></p>
                </div>

                <div class="agent-select-panel" id="agent-selection" style="opacity: 0.5; pointer-events: none;">
                    <h3>// CHOISIR VOTRE AGENT</h3>
                    <div class="agents-grid" id="agents-grid">
                        </div>
                    <button id="confirm-agent-btn" class="val-btn big-btn" disabled>CONFIRMER AGENT</button>
                </div>
            </div>
        </section>

        <section id="game-screen" class="hidden-screen">
            
            <div class="game-hud">
                <div class="timer-box">
                    <span class="label">TEMPS RESTANT</span>
                    <span id="game-timer" class="timer-val">30.00</span>
                </div>
                <div class="score-box">
                    <span class="label">SCORE</span>
                    <span id="score-display">0</span>
                </div>
            </div>

            <div class="race-container">
                <div class="track-lines"></div>
                <div class="racer-lane" id="player-lane">
                    <div class="avatar-wrapper" id="player-avatar-display">
                        <img src="" alt="Player" class="pixel-art">
                        <div class="fire-effect hidden">🔥</div>
                    </div>
                    <div class="player-name" id="player-name-display">VOUS</div>
                </div>
                <div class="racer-lane" id="opponent-lane">
                    <div class="avatar-wrapper" style="left: 0%">
                        <img src="https://api.dicebear.com/8.x/avataaars/svg?seed=Opponent" alt="Opponent">
                    </div>
                    <div class="player-name">CIBLE</div>
                </div>
                <div class="finish-line"></div>
            </div>

            <div class="quiz-interface val-card" id="quiz-panel">
                <div class="question-header">
                    <span class="category-tag" id="q-category">CALCUL</span>
                    <h2 id="q-text">En attente du lancement...</h2>
                </div>
                <div class="answers-grid" id="answers-buttons">
                    <button class="answer-btn" data-idx="0">A</button>
                    <button class="answer-btn" data-idx="1">B</button>
                    <button class="answer-btn" data-idx="2">C</button>
                    <button class="answer-btn" data-idx="3">D</button>
                </div>
            </div>

            <div id="result-overlay" class="hidden">
                <h1 id="result-title">VICTOIRE</h1>
                <button id="restart-btn" class="val-btn big-btn">REJOUER</button>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
