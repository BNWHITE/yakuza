<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEP Jungle Code Quest - Media Queries Demo</title>
    
    <style>
        /* ================================================= */
        /* 🎨 CSS : Le Design "Jungle Code" (Inspiré de l'image) */
        /* ================================================= */
        
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap');

        :root {
            --jungle-green-dark: #2a523a; /* Vert sombre pour le fond */
            --jungle-green-medium: #4c8a6b;
            --jungle-glow: #aaffaa; /* Vert fluo pour les reflets */
            --glow-shadow: 0 0 15px var(--jungle-glow), 0 0 5px var(--jungle-glow);
            --text-color-light: #fff;
            --button-color: #f7b731; /* Boutons dorés/jaunes pour contraste */
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            /* Gradient pour simuler l'atmosphère de jungle sombre/humide */
            background: linear-gradient(to bottom, #1e3c28 0%, #2a523a 100%);
            color: var(--text-color-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        h1, h2, h3, #countdown, #race-result {
            font-family: 'Press Start 2P', cursive;
            color: var(--jungle-glow);
            text-shadow: var(--glow-shadow);
        }
        h1 { font-size: 2.5em; margin: 0; }
        h2 { font-size: 1.5em; margin: 20px 0; }

        section {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--jungle-glow);
            box-shadow: 0 0 25px rgba(170, 255, 170, 0.4);
            margin: 20px;
            width: 90%;
            max-width: 1100px;
            text-align: center;
        }

        /* 💥 PROBLÈME 1 : Grille de sélection non-responsive (4 colonnes) 💥 */
        #student-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 colonnes fixes = DÉBORDEMENT sur mobile */
            gap: 25px;
            margin-top: 30px;
            padding: 10px;
        }

        .student-card {
            background-color: var(--jungle-green-dark);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            position: relative;
        }

        .student-card.selected {
            border: 4px solid var(--button-color);
            box-shadow: 0 0 30px var(--jungle-glow);
            transform: scale(1.05);
            background-color: var(--jungle-green-medium);
        }

        .student-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--jungle-glow);
            margin-bottom: 10px;
        }

        .student-card p {
            font-size: 0.9em;
            margin: 0;
            font-weight: bold;
        }
        .student-card span {
            display: block;
            font-size: 0.75em;
            color: #ccc;
        }

        .action-button {
            background-color: var(--button-color);
            color: var(--text-color-dark);
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        /* 💥 PROBLÈME 2 : Piste de Course sur Grand Écran 💥 */
        .race-track {
            /* Simule le sentier de la jungle */
            background-color: #3b533f;
            border: 5px solid #1e3c28;
            border-radius: 10px;
            margin: 30px auto;
            padding: 20px;
            position: relative;
            height: 200px;
            width: 95%; /* Largeur fixe qui sortira sur mobile */
            box-shadow: inset 0 0 30px rgba(0, 255, 0, 0.5);
            overflow: hidden; 
        }

        .cat-lane {
            position: absolute;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
        }
        .cat-lane:nth-child(1) { top: 10px; }
        .cat-lane:nth-child(2) { bottom: 10px; }

        .cat-lane img {
            width: 100px;
            height: auto;
            padding: 5px;
            border: 3px solid var(--jungle-glow);
            background-color: #222;
            position: relative;
            transition: transform 0.1s linear;
            z-index: 10;
        }

        .cat-lane .cat-name {
            font-family: 'Roboto', sans-serif;
            margin-left: 15px;
            font-size: 1em;
            color: #222;
            background-color: var(--jungle-glow);
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
        }

        #countdown { font-size: 3em; margin-top: 10px; }
        #race-result { font-size: 1.8em; margin-top: 30px; }

        /* ================================================= */
        /* 🛠️ SOLUTION : Les Media Queries 🛠️ */
        /* ================================================= */

        /* Écrans de taille moyenne (Tablettes) */
        @media (max-width: 992px) {
            h1 { font-size: 2em; }
            /* MQ pour la grille de sélection (4 -> 2 colonnes) */
            #student-selector {
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px;
            }
            .student-avatar {
                width: 70px;
                height: 70px;
            }
            /* MQ pour la piste de course */
            .race-track {
                height: 180px;
            }
            .cat-lane img {
                width: 80px;
            }
        }

        /* Petits écrans (Smartphones) */
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            h2 { font-size: 1em; margin: 15px 0; }
            
            /* MQ pour la grille de sélection (2 -> 1 colonne) */
            #student-selector {
                grid-template-columns: 1fr; /* Une seule colonne, le responsive parfait */
                gap: 10px;
            }
            .student-card {
                padding: 10px;
            }
            .student-avatar {
                width: 60px;
                height: 60px;
            }

            /* MQ pour la piste de course */
            .race-track {
                height: 120px; 
                padding: 5px;
            }
            .cat-lane img {
                width: 50px; /* Bots plus petits */
            }
            .cat-lane .cat-name {
                font-size: 0.7em;
                margin-left: 8px;
                padding: 3px 6px;
            }
            #countdown { font-size: 1.8em; }
            #race-result { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <header>
        <h1>ISEP Code Quest</h1>
        <h2>Jungle Edition</h2>
    </header>

    <main>
        <section id="selection-screen">
            <h2>Choisissez votre Bot-Explorateur :</h2>
            <div id="student-selector">
                </div>
            <button id="start-race-btn" class="action-button" style="display: none;">Lancer la Quête !</button>
        </section>

        <section id="race-screen" style="display: none;">
            <h2>Sentier de la Connaissance Perdue</h2>
            <h3 id="countdown">3</h3>
            
            <div class="race-track">
                <div class="cat-lane">
                    <img id="player-cat" src="https://api.dicebear.com/8.x/bottts/svg?seed=player&eyes=bulgy,round&mouth=smile,pucker" alt="Votre Bot">
                    <span id="player-name" class="cat-name">Joueur</span>
                </div>
                <div class="cat-lane">
                    <img id="opponent-cat" src="https://api.dicebear.com/8.x/bottts/svg?seed=opponent&eyes=bulgy,round&mouth=smile,pucker" alt="Bot Adversaire">
                    <span id="opponent-name" class="cat-name">Adversaire</span>
                </div>
            </div>
            <h3 id="race-result"></h3>
            <button id="reset-race-btn" class="action-button" style="display: none;">Nouvelle Expédition</button>
        </section>
    </main>

    <script>
        /* ================================================= */
        /* 🧠 JAVASCRIPT : Logique du Jeu */
        /* ================================================= */
        
        const students = [
            "Alexandre ALVES", "Douae BOULOUALI", "Sid-Ahmed BOUSLAH", "Leon JIANG", "Altheli RODRIGUEZ",
            "Maxime BOGNON", "Corentin BRAND", "Maximilien CANONNE", "Adel HENI", "Kahina MEDJUKANE",
            "Sully MORETON", "Aliénor ANTONA", "Nicolas CLEMENT", "Bryan DE FARIA", "Hani HOUMIMID",
            "Vithues KANDIAH", "Hector LE BACHELIER", "Quentin DABOVILLE", "Yassmina HARRISSI",
            "Allan LAHCENE", "Evan MASSE", "Seydina SY", "Ilay AL ABIAD", "Ahmed ELHATTAB",
            "Thushyan KOHILAKUMAR", "Aurélie MAHAUT", "Gaspard PONS", "Rafael RION", "Faruk SAN"
        ];
        
        const botTitles = ["Le Débogueur", "L'Optimiseur", "Le Bot-Ranger", "Le Maître du WiFi", "L'Algorithme Secret"];

        const studentSelector = document.getElementById('student-selector');
        const startRaceBtn = document.getElementById('start-race-btn');
        const selectionScreen = document.getElementById('selection-screen');
        const raceScreen = document.getElementById('race-screen');
        const playerCat = document.getElementById('player-cat');
        const playerName = document.getElementById('player-name');
        const opponentCat = document.getElementById('opponent-cat');
        const opponentName = document.getElementById('opponent-name');
        const countdownElement = document.getElementById('countdown');
        const raceResult = document.getElementById('race-result');
        const resetRaceBtn = document.getElementById('reset-race-btn');

        let selectedStudent = null;
        let opponentStudent = null;
        let currentRaceInterval = null;

        function initializeSelection() {
            studentSelector.innerHTML = ''; 
            students.forEach(student => {
                const card = document.createElement('div');
                card.classList.add('student-card');
                
                // Générer un avatar de Bot unique pour chaque étudiant
                const titleIndex = Math.floor(Math.random() * botTitles.length);
                const title = botTitles[titleIndex];
                
                const avatarUrl = `https://api.dicebear.com/8.x/bottts/svg?seed=${encodeURIComponent(student)}&scale=110`;
                const avatar = document.createElement('img');
                avatar.classList.add('student-avatar');
                avatar.src = avatarUrl;
                
                const nameElement = document.createElement('p');
                nameElement.textContent = student;
                
                const titleElement = document.createElement('span');
                titleElement.textContent = title;
                
                card.appendChild(avatar);
                card.appendChild(nameElement);
                card.appendChild(titleElement);
                
                card.addEventListener('click', () => selectStudent(student, card, avatarUrl));
                studentSelector.appendChild(card);
            });

            startRaceBtn.style.display = 'none';
            raceScreen.style.display = 'none';
            selectionScreen.style.display = 'block';
            resetRaceBtn.style.display = 'none';
            raceResult.textContent = '';
            
            // Réinitialiser les positions
            playerCat.style.transform = `translateX(0px)`;
            opponentCat.style.transform = `translateX(0px)`;
        }

        function selectStudent(student, card, avatarUrl) {
            Array.from(studentSelector.children).forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedStudent = student;
            playerCat.src = avatarUrl; // Prépare l'avatar pour la course
            startRaceBtn.style.display = 'block';
        }

        function generateOpponent() {
            let randomOpponent;
            do {
                randomOpponent = students[Math.floor(Math.random() * students.length)];
            } while (randomOpponent === selectedStudent);
            return randomOpponent;
        }

        startRaceBtn.addEventListener('click', () => {
            if (!selectedStudent) return;

            opponentStudent = generateOpponent();

            playerName.textContent = selectedStudent;
            opponentName.textContent = opponentStudent;
            
            // Générer l'avatar de l'adversaire
            opponentCat.src = `https://api.dicebear.com/8.x/bottts/svg?seed=${encodeURIComponent(opponentStudent)}&scale=110`;

            selectionScreen.style.display = 'none';
            raceScreen.style.display = 'block';
            
            startCountdown();
        });

        function startCountdown() {
            let count = 3;
            countdownElement.textContent = count;
            countdownElement.style.display = 'block';
            raceResult.textContent = '';
            resetRaceBtn.style.display = 'none';

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownElement.textContent = count;
                } else if (count === 0) {
                    countdownElement.textContent = "GO!";
                } else {
                    clearInterval(countdownInterval);
                    countdownElement.style.display = 'none';
                    startRace();
                }
            }, 1000);
        }

        function startRace() {
            const trackWidth = document.querySelector('.race-track').offsetWidth - playerCat.offsetWidth - 30; // 30 pour marges/padding
            let playerPosition = 0;
            let opponentPosition = 0;
            
            // Simuler des vitesses aléatoires pour une victoire non garantie
            const playerSpeed = 10 + Math.random() * 5; 
            const opponentSpeed = 10 + Math.random() * 5; 

            currentRaceInterval = setInterval(() => {
                playerPosition += Math.random() * playerSpeed; 
                opponentPosition += Math.random() * opponentSpeed; 

                // Assurer que les bots ne dépassent pas la ligne d'arrivée avant la déclaration
                playerCat.style.transform = `translateX(${Math.min(playerPosition, trackWidth)}px)`;
                opponentCat.style.transform = `translateX(${Math.min(opponentPosition, trackWidth)}px)`;

                if (playerPosition >= trackWidth || opponentPosition >= trackWidth) {
                    clearInterval(currentRaceInterval);
                    declareWinner(playerPosition, opponentPosition);
                }
            }, 70); 
        }

        function declareWinner(playerPos, opponentPos) {
            if (playerPos > opponentPos) {
                raceResult.textContent = `🏆 ${selectedStudent} trouve le Bug Sacré ! Victoire !`;
                raceResult.classList.add('win');
                raceResult.classList.remove('lose');
            } else {
                raceResult.textContent = `😭 ${opponentStudent} gagne la Quête ! Défaite du Bot.`;
                raceResult.classList.add('lose');
                raceResult.classList.remove('win');
            }
            resetRaceBtn.style.display = 'block';
        }

        resetRaceBtn.addEventListener('click', initializeSelection);

        // Initialiser le jeu au chargement
        initializeSelection();
    </script>
</body>
</html>
