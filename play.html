<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME // CLASSROOM PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="game-header">
        <a href="index.html" class="back-link">← ACCUEIL</a>
        <div class="user-status">AGENT: <span id="status-name">GUEST</span></div>
    </header>

    <main>
        <section id="lobby-screen" class="active-screen">
            <div class="lobby-wrapper">
                
                <div class="lobby-card selection-area">
                    <h3>// SÉLECTION AGENT</h3>
                    
                    <div class="avatar-preview-box">
                        <img id="avatar-display" src="https://api.dicebear.com/9.x/avataaars/svg?seed=X" alt="Avatar">
                    </div>

                    <div class="input-group">
                        <label>IDENTITÉ DE CLASSE</label>
                        <select id="student-select" class="val-select">
                            <option value="" disabled selected>-- CHOISIR UN ÉLÈVE --</option>
                            </select>
                    </div>

                    <button id="start-btn" class="val-btn full-width" disabled>ENTRER DANS L'ARÈNE</button>
                </div>

                <div class="lobby-card leaderboard-area">
                    <h3>🏆 TOP PERFORMANCE</h3>
                    <ul id="leaderboard-list" class="rank-list">
                        <li>Chargement...</li>
                    </ul>
                </div>

                <div class="mini-ad">
                    <a href="https://github.com/BNWHITE/BeReady" target="_blank">Besoin de réviser ? Go sur <strong>BeReady</strong></a>
                </div>
            </div>
        </section>

        <section id="game-screen" class="hidden-screen">
            <div class="hud-top">
                <div class="timer-display"><span id="timer">60</span>s</div>
                <div class="progress-bar-container">
                    <div id="p-bar" class="p-bar-fill"></div>
                </div>
            </div>

            <div class="race-track">
                <div class="finish-line"></div>
                <div id="player-racer" class="racer">
                    <img id="game-avatar" src="" alt="You">
                    <div class="fire-fx hidden">🔥</div>
                </div>
                <div id="bot-racer" class="racer bot">
                    <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=Teacher" alt="Bot">
                </div>
            </div>

            <div class="quiz-container val-card">
                <div class="q-header">
                    <span class="tag" id="q-theme">INFO</span>
                </div>
                <h2 id="q-text">Prêt ?</h2>
                <div class="options-grid" id="options-box">
                    </div>
            </div>
        </section>

        <div id="result-overlay" class="hidden">
            <div class="result-box">
                <h1 id="res-title">VICTOIRE</h1>
                <p id="res-score">Score: 0</p>
                <button onclick="location.reload()" class="val-btn">REJOUER</button>
                <br><br>
                <a href="https://beready-7yyt.onrender.com/" class="ad-link-end">Voir les cours sur BeReady</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
